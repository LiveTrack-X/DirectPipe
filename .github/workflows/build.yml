name: Build & Release

on:
  pull_request:
    branches: [v4, main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Upload artifacts to this exact source-version tag (e.g., vX.Y.Z). Leave empty for CI-only.'
        required: false
        default: ''

env:
  BUILD_TYPE: Release

jobs:
  text-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && format('refs/tags/{0}', github.event.inputs.release_tag)) || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check UTF-8 text integrity
        run: python tools/check_text_integrity.py --repo-root .

      - name: Version metadata check
        run: bash tools/pre-release-test.sh --version-only

      - name: Verify release tag matches canonical version
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          CANONICAL_VERSION=$(sed -nE 's/^project\(DirectPipe VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          test -n "$CANONICAL_VERSION"
          test "$RELEASE_TAG" = "v$CANONICAL_VERSION"
  # ═══════════════════════════════════════════
  # Windows — DirectPipe.exe + Receiver VST2/VST3
  # ═══════════════════════════════════════════
  build-windows:
    needs: [text-integrity]
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && format('refs/tags/{0}', github.event.inputs.release_tag)) || github.ref }}

      # Optional: restore proprietary SDKs from repository secrets
      - name: Restore VST2 SDK
        shell: bash
        env:
          VST2_SDK_B64: ${{ secrets.VST2_SDK_B64 }}
          RELEASE_BUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' }}
        run: |
          if [ -n "$VST2_SDK_B64" ]; then
            mkdir -p thirdparty/VST2_SDK/pluginterfaces/vst2.x
            echo "$VST2_SDK_B64" | base64 -d | tar xz -C thirdparty/VST2_SDK/
            test -f thirdparty/VST2_SDK/pluginterfaces/vst2.x/aeffect.h
            echo "✓ VST2 SDK restored"
          elif [ "$RELEASE_BUILD" = "true" ]; then
            echo "VST2_SDK_B64 is required for an advertised Windows release" >&2
            exit 1
          else
            echo "VST2 SDK secret not set — VST2 format skipped"
          fi

      - name: Restore ASIO SDK
        shell: bash
        env:
          ASIO_SDK_B64: ${{ secrets.ASIO_SDK_B64 }}
          RELEASE_BUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' }}
        run: |
          if [ -n "$ASIO_SDK_B64" ]; then
            mkdir -p thirdparty/asiosdk
            echo "$ASIO_SDK_B64" | base64 -d | tar xz -C thirdparty/asiosdk/
            test -f thirdparty/asiosdk/common/asio.h
            echo "✓ ASIO SDK restored"
          elif [ "$RELEASE_BUILD" = "true" ]; then
            echo "ASIO_SDK_B64 is required for an advertised Windows release" >&2
            exit 1
          else
            echo "ASIO SDK secret not set — ASIO driver disabled"
          fi

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run Tests
        run: cd build && ctest --output-on-failure -C Release --timeout 120

      - name: Package
        shell: bash
        env:
          RELEASE_BUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' }}
        run: |
          mkdir -p staging
          cp "build/host/DirectPipe_artefacts/Release/DirectPipe.exe" staging/

          # Receiver VST3
          if [ -d "build/plugins/receiver/DirectPipeReceiver_artefacts/Release/VST3" ]; then
            cp -r build/plugins/receiver/DirectPipeReceiver_artefacts/Release/VST3/*.vst3 staging/ 2>/dev/null || true
          fi

          # Receiver VST2 (only if SDK was available)
          if [ -d "build/plugins/receiver/DirectPipeReceiver_artefacts/Release/VST" ]; then
            cp build/plugins/receiver/DirectPipeReceiver_artefacts/Release/VST/*.dll staging/ 2>/dev/null || true
          fi

          if [ "$RELEASE_BUILD" = "true" ]; then
            compgen -G "staging/*.dll" >/dev/null || {
              echo "Required Receiver VST2 artifact is missing from the Windows release" >&2
              exit 1
            }
          fi

          echo "=== Windows package contents ==="
          ls -lh staging/

      - name: Restore optional Windows code-signing certificate
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_B64: ${{ secrets.WINDOWS_SIGNING_PFX_B64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace(
            $env:WINDOWS_SIGNING_PFX_B64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace(
            $env:WINDOWS_SIGNING_PFX_PASSWORD)

          if ($hasCertificate -ne $hasPassword) {
            throw "Windows signing is partially configured; provide both PFX and password or neither"
          }

          if (-not $hasCertificate) {
            "WINDOWS_SIGNING_ENABLED=false" >> $env:GITHUB_ENV
            Write-Warning "No trusted Authenticode certificate is configured; publishing an explicitly unsigned Windows package"
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "directpipe-release-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_B64))
          "WINDOWS_SIGNING_PFX_PATH=$certificatePath" >> $env:GITHUB_ENV
          "WINDOWS_SIGNING_ENABLED=true" >> $env:GITHUB_ENV

      - name: Validate and optionally sign Windows release binaries
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $timestampUrl = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) {
            "https://timestamp.digicert.com"
          } else {
            $env:WINDOWS_TIMESTAMP_URL
          }

          try {
            if ($env:WINDOWS_SIGNING_ENABLED -eq "true") {
              ./tools/sign-windows-release.ps1 `
                -StagingDirectory "staging" `
                -CertificatePath $env:WINDOWS_SIGNING_PFX_PATH `
                -TimestampUrl $timestampUrl
              "WINDOWS_RELEASE_SIGNATURE_MODE=signed" >> $env:GITHUB_ENV
            } else {
              $expectedRelativePaths = @(
                "DirectPipe.exe",
                "DirectPipe Receiver.dll",
                "DirectPipe Receiver.vst3\Contents\x86_64-win\DirectPipe Receiver.vst3"
              )
              $releaseBinaries = @(
                foreach ($relativePath in $expectedRelativePaths) {
                  $binaryPath = Join-Path "staging" $relativePath
                  if (-not (Test-Path -LiteralPath $binaryPath -PathType Leaf)) {
                    throw "Required Windows release binary is missing: $relativePath"
                  }
                  Get-Item -LiteralPath $binaryPath
                }
              )
              $allReleaseBinaries = @(
                Get-ChildItem -LiteralPath "staging" -Recurse -File |
                Where-Object {
                  $_.Extension.ToLowerInvariant() -in ".exe", ".dll", ".vst3"
                }
              )
              if ($allReleaseBinaries.Count -ne $releaseBinaries.Count) {
                throw "Expected exactly DirectPipe.exe and Receiver VST2/VST3 binaries; found $($allReleaseBinaries.Count)"
              }

              foreach ($binary in $releaseBinaries) {
                $signature = Get-AuthenticodeSignature -LiteralPath $binary.FullName
                if ($signature.Status -ne
                    [System.Management.Automation.SignatureStatus]::NotSigned) {
                  throw "No signing certificate is configured, but the Windows binary is not explicitly unsigned: $($binary.FullName) ($($signature.Status))"
                }
              }
              Write-Warning "Windows release binaries are unsigned; exact asset, SHA-256, and executable-version checks remain mandatory"
              "WINDOWS_RELEASE_SIGNATURE_MODE=unsigned" >> $env:GITHUB_ENV
            }
          } finally {
            if ($env:WINDOWS_SIGNING_PFX_PATH -and
                (Test-Path -LiteralPath $env:WINDOWS_SIGNING_PFX_PATH)) {
              Remove-Item -LiteralPath $env:WINDOWS_SIGNING_PFX_PATH -Force
            }
          }

      - name: Verify Windows release binary versions
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ github.event.inputs.release_tag }}
        run: |
          $releaseTag = $env:EXPECTED_VERSION.Trim()
          if ($releaseTag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Release tag is not strict vMAJOR.MINOR.PATCH: $env:EXPECTED_VERSION"
          }
          $expected = $Matches[1]

          $expectedRelativePaths = @(
            "DirectPipe.exe",
            "DirectPipe Receiver.dll",
            "DirectPipe Receiver.vst3\Contents\x86_64-win\DirectPipe Receiver.vst3"
          )
          $releaseBinaries = @(
            foreach ($relativePath in $expectedRelativePaths) {
              $binaryPath = Join-Path "staging" $relativePath
              if (-not (Test-Path -LiteralPath $binaryPath -PathType Leaf)) {
                throw "Required Windows release binary is missing: $relativePath"
              }
              Get-Item -LiteralPath $binaryPath
            }
          )
          $allReleaseBinaries = @(
            Get-ChildItem -LiteralPath "staging" -Recurse -File |
              Where-Object {
                $_.Extension.ToLowerInvariant() -in ".exe", ".dll", ".vst3"
              }
          )
          if ($allReleaseBinaries.Count -ne $releaseBinaries.Count) {
            throw "Expected exactly DirectPipe.exe and Receiver VST2/VST3 binaries; found $($allReleaseBinaries.Count)"
          }

          foreach ($binary in $releaseBinaries) {
            $version = $binary.VersionInfo
            if (($version.FileVersion -ne $expected) -or
                ($version.ProductVersion -ne $expected)) {
              throw "Windows binary version mismatch: $($binary.FullName) (FileVersion=$($version.FileVersion), ProductVersion=$($version.ProductVersion), expected=$expected)"
            }
            Write-Host "Verified version $expected`: $($binary.FullName)"
          }

      - name: Create ZIP
        shell: bash
        run: |
          cd staging
          7z a -tzip ../DirectPipe-win64.zip .
          cd ..
          ls -lh DirectPipe-win64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DirectPipe-win64
          path: DirectPipe-win64.zip
          if-no-files-found: error

  # ═══════════════════════════════════════════
  # macOS — DirectPipe.app + Receiver VST2/VST3/AU (Universal Binary)
  # ═══════════════════════════════════════════
  build-macos:
    needs: [text-integrity]
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && format('refs/tags/{0}', github.event.inputs.release_tag)) || github.ref }}

      - name: Restore VST2 SDK
        env:
          VST2_SDK_B64: ${{ secrets.VST2_SDK_B64 }}
          RELEASE_BUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' }}
        run: |
          if [ -n "$VST2_SDK_B64" ]; then
            mkdir -p thirdparty/VST2_SDK/pluginterfaces/vst2.x
            echo "$VST2_SDK_B64" | base64 -d | tar xz -C thirdparty/VST2_SDK/
            test -f thirdparty/VST2_SDK/pluginterfaces/vst2.x/aeffect.h
            echo "✓ VST2 SDK restored"
          elif [ "$RELEASE_BUILD" = "true" ]; then
            echo "VST2_SDK_B64 is required for the advertised macOS VST2 artifact" >&2
            exit 1
          else
            echo "VST2 SDK secret not set — VST2 format skipped"
          fi

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Wno-deprecated-declarations"

      - name: Build
        run: cmake --build build --config Release -j$(sysctl -n hw.ncpu)

      - name: Run Tests
        run: cd build && ctest --output-on-failure --timeout 120

      - name: Package
        env:
          RELEASE_BUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' }}
        run: |
          mkdir -p staging

          # DirectPipe.app (ditto preserves bundles, symlinks, resource forks)
          ditto "build/host/DirectPipe_artefacts/Release/DirectPipe.app" "staging/DirectPipe.app"

          # Receiver VST3
          for f in build/plugins/receiver/DirectPipeReceiver_artefacts/Release/VST3/*.vst3; do
            [ -e "$f" ] && ditto "$f" "staging/$(basename "$f")"
          done

          # Receiver VST2 (.vst bundle)
          for f in build/plugins/receiver/DirectPipeReceiver_artefacts/Release/VST/*.vst; do
            [ -e "$f" ] && ditto "$f" "staging/$(basename "$f")"
          done

          # Receiver AU (.component bundle)
          for f in build/plugins/receiver/DirectPipeReceiver_artefacts/Release/AU/*.component; do
            [ -e "$f" ] && ditto "$f" "staging/$(basename "$f")"
          done

          if [ "$RELEASE_BUILD" = "true" ]; then
            find staging -maxdepth 1 -name '*.vst' -print -quit | grep -q . || {
              echo "Required Receiver VST2 artifact is missing from the macOS release" >&2
              exit 1
            }
          fi

          echo "=== macOS package contents ==="
          ls -lhR staging/

      - name: Create DMG
        run: |
          hdiutil create -volname "DirectPipe" \
            -srcfolder staging \
            -ov -format UDZO \
            DirectPipe-macOS.dmg
          ls -lh DirectPipe-macOS.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DirectPipe-macOS
          path: DirectPipe-macOS.dmg
          if-no-files-found: error

  # ═══════════════════════════════════════════
  # Linux — DirectPipe + Receiver VST2/VST3
  # ═══════════════════════════════════════════
  build-linux:
    needs: [text-integrity]
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && format('refs/tags/{0}', github.event.inputs.release_tag)) || github.ref }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libgl-dev

      - name: Restore VST2 SDK
        env:
          VST2_SDK_B64: ${{ secrets.VST2_SDK_B64 }}
          RELEASE_BUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' }}
        run: |
          if [ -n "$VST2_SDK_B64" ]; then
            mkdir -p thirdparty/VST2_SDK/pluginterfaces/vst2.x
            echo "$VST2_SDK_B64" | base64 -d | tar xz -C thirdparty/VST2_SDK/
            test -f thirdparty/VST2_SDK/pluginterfaces/vst2.x/aeffect.h
            echo "✓ VST2 SDK restored"
          elif [ "$RELEASE_BUILD" = "true" ]; then
            echo "VST2_SDK_B64 is required for the advertised Linux VST2 artifact" >&2
            exit 1
          else
            echo "VST2 SDK secret not set — VST2 format skipped"
          fi

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j$(nproc)

      - name: Run Tests
        run: cd build && ctest --output-on-failure --timeout 120

      - name: Package
        env:
          RELEASE_BUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' }}
        run: |
          mkdir -p staging

          cp "build/host/DirectPipe_artefacts/Release/DirectPipe" staging/
          chmod +x staging/DirectPipe

          # Receiver VST3
          cp -r build/plugins/receiver/DirectPipeReceiver_artefacts/Release/VST3/*.vst3 staging/ 2>/dev/null || true

          # Receiver VST2 (.so)
          cp build/plugins/receiver/DirectPipeReceiver_artefacts/Release/VST/*.so staging/ 2>/dev/null || true

          if [ "$RELEASE_BUILD" = "true" ]; then
            compgen -G "staging/*.so" >/dev/null || {
              echo "Required Receiver VST2 artifact is missing from the Linux release" >&2
              exit 1
            }
          fi

          echo "=== Linux package contents ==="
          ls -lh staging/

      - name: Create tar.gz
        run: |
          cd staging
          tar czf ../DirectPipe-linux-x64.tar.gz .
          cd ..
          ls -lh DirectPipe-linux-x64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DirectPipe-linux-x64
          path: DirectPipe-linux-x64.tar.gz
          if-no-files-found: error

  # ═══════════════════════════════════════════
  # Stream Deck Plugin — cross-platform Node.js package
  # ═══════════════════════════════════════════
  build-streamdeck:
    needs: [text-integrity]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && format('refs/tags/{0}', github.event.inputs.release_tag)) || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: com.directpipe.directpipe.sdPlugin
        run: npm ci

      - name: Audit dependencies
        working-directory: com.directpipe.directpipe.sdPlugin
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high

      - name: Generate icons (SVG -> PNG)
        working-directory: com.directpipe.directpipe.sdPlugin
        run: npm run icons

      - name: Run tests
        working-directory: com.directpipe.directpipe.sdPlugin
        run: npm test

      - name: Build (Rollup bundle)
        working-directory: com.directpipe.directpipe.sdPlugin
        run: npm run build

      - name: Install Stream Deck CLI
        run: npm install -g @elgato/cli

      - name: Validate Stream Deck Plugin
        working-directory: com.directpipe.directpipe.sdPlugin
        run: npm run validate

      - name: Pack Stream Deck Plugin
        working-directory: com.directpipe.directpipe.sdPlugin
        run: |
          streamdeck pack . --output ../dist/ --force
          ls -lh ../dist/*.streamDeckPlugin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamDeck-Plugin
          path: dist/com.directpipe.directpipe.streamDeckPlugin
          if-no-files-found: error

  # ═══════════════════════════════════════════
  # Publish a GitHub Release only after every validation/build artifact exists.
  # ═══════════════════════════════════════════
  publish-release:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
    needs: [build-windows, build-macos, build-linux, build-streamdeck]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ format('refs/tags/{0}', github.event.inputs.release_tag) }}

      - name: Determine release tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Rename and list artifacts
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          mkdir -p release

          # Windows ZIP
          cp artifacts/DirectPipe-win64/DirectPipe-win64.zip \
             "release/DirectPipe-${TAG}-Windows.zip"

          # macOS DMG
          cp artifacts/DirectPipe-macOS/DirectPipe-macOS.dmg \
             "release/DirectPipe-${TAG}-macOS.dmg"

          # Linux tar.gz
          cp artifacts/DirectPipe-linux-x64/DirectPipe-linux-x64.tar.gz \
             "release/DirectPipe-${TAG}-Linux.tar.gz"

          # Stream Deck Plugin
          cp artifacts/StreamDeck-Plugin/com.directpipe.directpipe.streamDeckPlugin \
             "release/com.directpipe.directpipe.streamDeckPlugin"

          # Generate SHA-256 checksums for integrity verification
          cd release
          sha256sum * > checksums.sha256
          cd ..

          echo "=== Release artifacts ==="
          ls -lh release/
          echo "=== Checksums ==="
          cat release/checksums.sha256

      - name: Create draft with validated assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" \
              --repo ${{ github.repository }} \
              --json isDraft \
              --jq '.isDraft')
            if [ "$IS_DRAFT" != "true" ]; then
              echo "Published release $TAG already exists; refusing to overwrite it." >&2
              exit 1
            fi

            # A previous attempt may have left a partial draft or stale asset.
            # Remove only that unpublished release (the source tag is retained)
            # and recreate it from the complete validated artifact set.
            gh release delete "$TAG" \
              --repo ${{ github.repository }} \
              --yes
          fi

          gh release create "$TAG" release/* \
            --repo ${{ github.repository }} \
            --verify-tag \
            --draft \
            --notes-file dist/release_body.md \
            --title "DirectPipe $TAG"

          # The release is invisible to users until every asset (including
          # checksums.sha256) has uploaded successfully.
          gh release edit "$TAG" \
            --repo ${{ github.repository }} \
            --draft=false \
            --latest
